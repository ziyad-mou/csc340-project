<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | PokeVerse</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/png" href="images/poke.png">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <img src="images/PokeVerse-logo.png" alt="PokeVerse Logo">
        </a>

        <nav>
            <a href="index.html#features">Features</a>
            <a href="index.html#how-it-works">How It Works</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="signup-btn">Sign Up</a>
        </div>

    </header>


    <!-- REGISTER PAGE -->
    <main class="auth-page">

        <section class="auth-card">

            <p class="auth-eyebrow">
                JOIN POKEVERSE
            </p>

            <h1>Create Your Account</h1>

            <p class="auth-description">
                Create a profile and start exploring the Pokémon card marketplace.
            </p>


            <form class="auth-form" id="register-form">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        I want to join as:
                    </label>

                    <div class="role-choice">


                        <!-- CUSTOMER -->
                        <label class="role-choice-card">

                            <input
                                type="radio"
                                name="role"
                                value="customer"
                                checked
                            >

                            <span>

                                <strong>
                                    Buyer
                                </strong>

                                Buy and collect Pokémon cards

                            </span>

                        </label>


                        <!-- PROVIDER -->
                        <label class="role-choice-card">

                            <input
                                type="radio"
                                name="role"
                                value="provider"
                            >

                            <span>

                                <strong>
                                    Seller
                                </strong>

                                List and sell Pokémon cards

                            </span>

                        </label>


                    </div>

                </div>


                <!-- CREATE ACCOUNT -->
                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <h3>PokeVerse</h3>

        <p>
            Buy. Sell. Collect.
        </p>

        <p>
            CSC 340 Software Engineering Project
        </p>

    </footer>


    <!-- REGISTER REDIRECT -->
    <script>

        const registerForm =
            document.getElementById("register-form");


        registerForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                /* GET PASSWORDS */

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirm-password").value;


                /* CHECK PASSWORDS */

                if (password !== confirmPassword) {

                    alert("Passwords do not match.");

                    return;

                }


                /* GET SELECTED ROLE */

                const selectedRole =
                    document.querySelector(
                        'input[name="role"]:checked'
                    );


                /* CUSTOMER */

                if (selectedRole.value === "customer") {

                    window.location.href =
                        "customer/index.html";

                }


                /* PROVIDER */

                else if (selectedRole.value === "provider") {

                    window.location.href =
                        "provider/index.html";

                }

            }
        );

    </script>


</body>

</html>
