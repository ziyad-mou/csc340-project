<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PokeVerse</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/png" href="images/poke.png">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <img src="images/PokeVerse-logo.png" alt="PokeVerse Logo">
        </a>

        <nav>
            <a href="index.html#features">Features</a>
            <a href="index.html#how-it-works">How It Works</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="signup-btn">Sign Up</a>
        </div>

    </header>


    <!-- LOGIN PAGE -->
    <main class="auth-page">

        <section class="auth-card">

            <p class="auth-eyebrow">
                WELCOME BACK
            </p>

            <h1>Login to PokeVerse</h1>

            <p class="auth-description">
                Sign in to continue exploring the Pokémon card marketplace.
            </p>


            <form class="auth-form">

                <div class="form-group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                    >

                </div>


                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="button" class="auth-submit">
                    Login
                </button>

            </form>


            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <h3>PokeVerse</h3>

        <p>Buy. Sell. Collect.</p>

        <p>CSC 340 Software Engineering Project</p>

    </footer>

</body>

</html>
